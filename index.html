<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="color-scheme" content="dark">
  <!-- Сетевые обращения разрешены только к публичным API бирж. -->
  <meta http-equiv="Content-Security-Policy" content="connect-src https://fapi.binance.com https://api.binance.com https://data-api.binance.vision https://api.bybit.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="SMC Signals — торговые сигналы Smart Money Concepts по 10 монетам. Только подсказки, без торговли и ключей.">
  <title>SMC Signals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="SMC Signals"><span class="brand-mark" aria-hidden="true"></span>SMC Signals</div>
    <div id="status" class="status" role="status" aria-live="polite"><span class="dot idle" aria-hidden="true"></span><span class="st-src">Запуск…</span></div>
  </header>

  <main id="app">
    <section id="screen-best" class="screen" data-screen="best" aria-label="Лучшая сделка сейчас"></section>
    <section id="screen-signals" class="screen" data-screen="signals" aria-label="Сигналы" hidden></section>
    <section id="screen-calc" class="screen" data-screen="calc" aria-label="Калькулятор прибыли" hidden></section>
    <section id="screen-backtest" class="screen" data-screen="backtest" aria-label="Проверка стратегии" hidden></section>
    <section id="screen-settings" class="screen" data-screen="settings" aria-label="Настройки" hidden></section>
    <noscript><div class="card">Для работы приложения нужен JavaScript.</div></noscript>
  </main>

  <nav class="tabbar" aria-label="Разделы">
    <button type="button" class="tab on" data-screen="best" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></svg>
      <span>Сейчас</span>
    </button>
    <button type="button" class="tab" data-screen="signals">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1.3"/><circle cx="4.5" cy="12" r="1.3"/><circle cx="4.5" cy="18" r="1.3"/></svg>
      <span>Сигналы</span>
    </button>
    <button type="button" class="tab" data-screen="calc">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M8.5 6.5h7M8.5 11h1.5M14 11h1.5M8.5 14.5h1.5M14 14.5h1.5M8.5 18h1.5M14 18h1.5"/></svg>
      <span>Расчёт</span>
    </button>
    <button type="button" class="tab" data-screen="backtest">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 3.5v17h17"/><path d="M7 15l4-4.5 3 3 5.5-6.5"/></svg>
      <span>Бэктест</span>
    </button>
    <button type="button" class="tab" data-screen="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>Настройки</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="alert" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/smc.js"></script>
  <script src="js/signals.js"></script>
  <script src="js/backtest.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
